apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-gitops-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/getGlitch/mini-gitops-store-gitiops.git
    targetRevision: main
    path: charts/mini-gitops-store
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mini-gitops-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
